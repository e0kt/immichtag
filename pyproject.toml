[project]
name = "immichtag"
version = "0.2.0"
description = "PixAI anime tagger -> Immich-compatible XMP sidecars, with tag filtering, export and Immich sync"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Version FLOORS, not pins: wheel availability tracks the Python version, and a
    # hard pin here is what breaks the install on the next interpreter bump.
    "huggingface-hub>=0.24",
    "lxml>=5.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "tqdm>=4.66",
    # PixAI Tagger v1.0 ships as PyTorch weights plus model code that imports these.
    "safetensors>=0.4",
    "timm>=1.0",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.46",
]

[project.scripts]
immichtag = "immichtag.cli:main"
immichtag-filter = "immichtag.filter_cli:main"
immichtag-web = "immichtag.web_cli:main"
immichtag-sync = "immichtag.immich_cli:main"
immichtag-backup = "immichtag.backup_cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immichtag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the cached PixAI model and an Apple GPU"]
